# Multiple Jobs Pipeline
name: Multiple Job Pipeline
on: push

jobs:
  code: 
    runs-on: ubuntu-latest
    steps:
      - name: Code Quality Checks
        run: echo "Checking code quality"

  test:
    runs-on: ubuntu-latest
    needs: code
    steps:
      - name: Run Tests
        run: echo "Running tests"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Build applications
        run: echo "Building Applications"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Code
        run: echo "Deploying code"
      
    
